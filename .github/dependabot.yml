version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories: ["/", "/app", "/evals"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
    ignore:
      # typescript-eslint caps its TypeScript peer below the next major; take
      # a TypeScript major only together with a typescript-eslint that supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vue-tsc 3.3.12 types every non-reactive `let` read in a template as `never`
      # (vuejs/language-tools#6237); stay on 3.3.11 until a fixed release.
      - dependency-name: vue-tsc
        versions: ["3.3.12"]
