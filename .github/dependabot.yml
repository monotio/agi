version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories: ["/", "/app", "/evals"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
    ignore:
      # typescript-eslint caps its TypeScript peer below the next major; take
      # a TypeScript major only together with a typescript-eslint that supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
