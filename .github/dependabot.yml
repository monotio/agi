version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directories: ["/", "/app", "/evals"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
    ignore:
      # typescript-eslint caps its TypeScript peer below the next major; take
      # a TypeScript major only together with a typescript-eslint that supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vue-tsc 3.3.12 and 3.3.13 regress template control flow
      # (vuejs/language-tools#6237); 3.3.14 fixes it, so skip only the broken releases.
      - dependency-name: vue-tsc
        versions: ["3.3.12", "3.3.13"]
