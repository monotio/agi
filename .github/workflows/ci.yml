name: CI
on:
  push:
    branches: [main, "lane/**", "rc/**"]
  pull_request:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    uses: ./.github/workflows/prepare.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      head: ${{ github.sha }}

  quality:
    name: Static checks and unit tests
    needs: prepare
    if: needs.prepare.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
      - run: npm run check

  build:
    needs: prepare
    if: needs.prepare.outputs.browsers == 'true' && needs.prepare.outputs.duplicate != 'true'
    uses: ./.github/workflows/build.yml

  check:
    # Branch protection keeps this exact context; build and quality run in parallel.
    name: Typecheck, lint, unit tests, build
    if: always()
    needs: [prepare, quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require checks and the applicable build
        env:
          PREPARE: ${{ needs.prepare.result }}
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          BROWSERS: ${{ needs.prepare.outputs.browsers }}
          DUPLICATE: ${{ needs.prepare.outputs.duplicate }}
        run: |
          test "$PREPARE" = success
          if [ "$DUPLICATE" = true ]; then exit 0; fi
          test "$QUALITY" = success
          if [ "$BROWSERS" = true ]; then test "$BUILD" = success; else test "$BUILD" = skipped; fi

  suites:
    needs: [prepare, build]
    if: needs.prepare.outputs.browsers == 'true' && needs.prepare.outputs.duplicate != 'true'
    uses: ./.github/workflows/browser-suites.yml
    with:
      production: true

  burn:
    name: PR burn-in (${{ matrix.browser }})
    needs: [prepare, build]
    if: github.event_name == 'pull_request' && needs.prepare.outputs.specs != '[]' && needs.prepare.outputs.browsers == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
        with:
          browser: ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agi-site
          path: app/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agi-bundle-graph
          path: app/node_modules/.agi
      - name: Repeat changed specs five times
        env:
          SPECS: ${{ needs.prepare.outputs.specs }}
          BROWSER: ${{ matrix.browser }}
        run: python3 scripts/ci/tools.py burn --specs "$SPECS" --browser "$BROWSER"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: burn-${{ matrix.browser }}
          path: |
            app/test-results/ci-reports/
            app/test-results/
          retention-days: 7

  browsers:
    name: Playwright (play, remix and export)
    if: always()
    needs: [prepare, suites, burn]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every applicable browser job to pass
        env:
          PREPARE: ${{ needs.prepare.result }}
          SUITES: ${{ needs.suites.result }}
          BURN: ${{ needs.burn.result }}
          BROWSERS: ${{ needs.prepare.outputs.browsers }}
          DUPLICATE: ${{ needs.prepare.outputs.duplicate }}
        run: |
          test "$PREPARE" = success
          if [ "$DUPLICATE" = true ] || [ "$BROWSERS" = false ]; then
            test "$SUITES" = skipped
          else
            test "$SUITES" = success
          fi
          test "$BURN" = success || test "$BURN" = skipped

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, browsers]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://agi.monotio.com/
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: agi-production
      cancel-in-progress: false
    steps:
      # Only the deploy verifier, kept apart from the published folder; nothing is rebuilt.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /scripts/verify-deploy.ts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agi-site
          path: release
      - name: Restrict origin to the production gateway
        env:
          FRONT_DOOR_ID: ${{ secrets.FRONT_DOOR_ID }}
          FRONT_DOOR_HOST: ${{ secrets.FRONT_DOOR_HOST }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          identity = os.environ['FRONT_DOOR_ID']
          hostname = os.environ['FRONT_DOOR_HOST']
          if not identity or not hostname:
              raise SystemExit('Production gateway configuration is missing')
          path = Path('release/staticwebapp.config.json')
          config = json.loads(path.read_text())
          config['networking'] = {'allowedIpRanges': ['AzureFrontDoor.Backend']}
          config['forwardingGateway'] = {
              'requiredHeaders': {'X-Azure-FDID': identity},
              'allowedForwardedHosts': ['agi.monotio.com', hostname],
          }
          path.write_text(json.dumps(config))
          PYTHON
      - name: Reject obsolete workflow re-runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
      - name: Sign in using a short-lived Azure identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Acquire a masked deployment token
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          AZURE_STATIC_WEB_APP_NAME: ${{ secrets.AZURE_STATIC_WEB_APP_NAME }}
        run: |
          token="$(az staticwebapp secrets list --name "$AZURE_STATIC_WEB_APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey -o tsv --only-show-errors)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Publish the checked artifact
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          action: upload
          app_location: release
          output_location: ""
          production_branch: main
          skip_app_build: true
          skip_api_build: true
          azure_static_web_apps_api_token: ${{ env.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      # Proves the live site is this run's artifact: the index carries this
      # commit's build identifier and its entry assets match the artifact's
      # SHA-256 digests. Retries while the edge propagates.
      - name: Verify the public site serves this build
        run: node --experimental-strip-types source/scripts/verify-deploy.ts --url https://agi.monotio.com/ --commit "$GITHUB_SHA" --artifact release --attempts 8 --delay 10

  verify:
    name: Verify deployed browser app
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
        with:
          browser: chromium
      - run: npm --prefix app run e2e:production
        env:
          AGI_DEPLOY_URL: https://agi.monotio.com
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-deployed
          path: app/test-results/
          retention-days: 7
