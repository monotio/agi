name: Build production artifact
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
      - run: npm --prefix app run build -- --base=/
      - run: npm run check:bundle
      - name: Package public files only
        run: |
          mkdir -p release
          cp -R app/dist/. release/
          cp app/staticwebapp.config.json release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agi-site
          path: release/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agi-bundle-graph
          path: app/node_modules/.agi/bundle-graph.json
          if-no-files-found: error
          retention-days: 14
