name: Browser suites
on:
  workflow_call:
    inputs:
      repeat:
        type: number
        default: 1
      production:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  e2e:
    name: Playwright (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.repeat > 1 && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, index: 1, label: chromium 1/6 }
          - { browser: chromium, index: 2, label: chromium 2/6 }
          - { browser: chromium, index: 3, label: chromium 3/6 }
          - { browser: chromium, index: 4, label: chromium 4/6 }
          - { browser: chromium, index: 5, label: chromium 5/6 }
          - { browser: chromium, index: 6, label: chromium 6/6 }
          - { browser: chromium, index: perf, label: timing budgets }
          - { browser: webkit, index: phone, label: webkit phone }
          - { browser: webkit, index: desktop-1, shard: 1, label: webkit desktop 1/2 }
          - { browser: webkit, index: desktop-2, shard: 2, label: webkit desktop 2/2 }
    env:
      CI: "1"
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/ci-reports/${{ matrix.browser }}-${{ matrix.index }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
        with:
          browser: ${{ matrix.browser }}
      - name: Chromium shard
        if: matrix.browser == 'chromium' && matrix.index != 'perf'
        env:
          INDEX: ${{ matrix.index }}
          REPEAT: ${{ inputs.repeat }}
        run: python3 scripts/ci/tools.py shard --index "$INDEX" --repeat "$REPEAT" --report "app/test-results/ci-reports/chromium-$INDEX.json"
      - name: Timing budgets on one worker
        if: matrix.index == 'perf'
        env:
          REPEAT: ${{ inputs.repeat }}
        run: npm --prefix app run e2e:perf -- --repeat-each="$REPEAT" --reporter=list,json
      - name: Storage benchmark on one worker
        if: ${{ !cancelled() && matrix.index == 'perf' }}
        env:
          REPEAT: ${{ inputs.repeat }}
        run: python3 scripts/ci/tools.py isolated --repeat "$REPEAT" --report app/test-results/ci-reports/chromium-benchmark.json
      - name: WebKit phone
        if: matrix.index == 'phone'
        env:
          REPEAT: ${{ inputs.repeat }}
        run: npm --prefix app run e2e:phone -- --project=iphone-webkit --repeat-each="$REPEAT" --reporter=list,json
      - name: WebKit desktop
        if: matrix.shard != '' && matrix.browser == 'webkit'
        env:
          REPEAT: ${{ inputs.repeat }}
          INDEX: ${{ matrix.shard }}
        run: python3 scripts/ci/tools.py shard --suite webkit --index "$INDEX" --count 2 --repeat "$REPEAT" --report "app/test-results/ci-reports/webkit-desktop-$INDEX.json"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report-${{ matrix.browser }}-${{ matrix.index }}
          path: app/test-results/ci-reports/*.json
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-${{ matrix.browser }}-${{ matrix.index }}
          path: app/test-results/
          retention-days: 7

  production:
    name: Production browser (${{ matrix.browser }})
    if: inputs.production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      CI: "1"
      PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/ci-reports/production-${{ matrix.browser }}.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./scripts/ci/setup
        with:
          browser: ${{ matrix.browser }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agi-site
          path: app/dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agi-bundle-graph
          path: app/node_modules/.agi
      - name: Production tests
        env:
          BROWSER: ${{ matrix.browser }}
          REPEAT: ${{ inputs.repeat }}
        run: npm --prefix app run e2e:production -- --browser="$BROWSER" --repeat-each="$REPEAT" --reporter=list,json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-report-production-${{ matrix.browser }}
          path: app/test-results/ci-reports/*.json
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-production-${{ matrix.browser }}
          path: app/test-results/
          retention-days: 7
