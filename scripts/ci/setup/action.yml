name: Restore CI environment
description: Restore installed dependencies and verify the browser container.
inputs:
  browser:
    description: Playwright browser to verify (empty for Node jobs)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Browser cache compression
      if: inputs.browser != ''
      shell: bash
      run: |
        zstd --version
        unzstd --version
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: |
          node_modules
          app/node_modules
        key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}-v2
        fail-on-cache-miss: true
    - name: Runner capacity and workers
      shell: bash
      run: |
        nproc
        free -h
        echo "PLAYWRIGHT_WORKERS=2" >> "$GITHUB_ENV"
    - name: Verify Playwright container version
      if: inputs.browser != ''
      shell: bash
      run: python3 scripts/ci/browser_image.py
    - name: Browser font inventory
      if: inputs.browser != ''
      shell: bash
      run: |
        fc-list : family file | sort
