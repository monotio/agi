name: Restore CI environment
description: Restore installed dependencies and verify the browser container.
inputs:
  browser:
    description: Playwright browser to verify (empty for Node jobs)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - name: Browser cache compression
      if: inputs.browser != ''
      shell: bash
      run: |
        zstd --version
        unzstd --version
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: |
          node_modules
          app/node_modules
        key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}-v1
        fail-on-cache-miss: true
    - name: Runner capacity and workers
      shell: bash
      run: |
        nproc
        free -h
        echo "PLAYWRIGHT_WORKERS=2" >> "$GITHUB_ENV"
    - name: Verify Playwright container version
      if: inputs.browser != ''
      shell: bash
      run: python3 scripts/ci/browser_image.py
    - name: Browser font inventory
      if: inputs.browser != ''
      shell: bash
      run: |
        fc-list : family file | sort
