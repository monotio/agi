name: Restore CI environment
description: Restore installed dependencies and versioned browsers on a fresh Linux runner.
inputs:
  browser:
    description: Playwright browser to install (empty for Node jobs)
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: |
          node_modules
          app/node_modules
        key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'app/package-lock.json') }}-v1
        fail-on-cache-miss: true
    - name: Runner capacity and workers
      shell: bash
      run: |
        nproc
        free -h
        echo "PLAYWRIGHT_WORKERS=2" >> "$GITHUB_ENV"
    - name: Browser version
      if: inputs.browser != ''
      id: version
      shell: bash
      run: |
        echo "version=$(node -p 'require("./app/node_modules/playwright-core/package.json").version')" >> "$GITHUB_OUTPUT"
        image=$( . /etc/os-release; printf '%s-%s' "$ID" "$VERSION_ID" )
        echo "image=$image" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: inputs.browser != ''
      id: browser
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: ~/.cache/ms-playwright
        key: browsers-${{ runner.os }}-${{ steps.version.outputs.image }}-${{ steps.version.outputs.version }}-${{ inputs.browser }}
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: inputs.browser != ''
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
      with:
        path: /tmp/agi-apt/*.deb
        key: apt-${{ runner.os }}-${{ steps.version.outputs.image }}-${{ steps.version.outputs.version }}-${{ inputs.browser }}
    - name: Browser system dependencies
      if: inputs.browser != ''
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        mkdir -p /tmp/agi-apt/partial
        printf 'Dir::Cache::archives "/tmp/agi-apt";\nAPT::Keep-Downloaded-Packages "true";\nBinary::apt::APT::Keep-Downloaded-Packages "true";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\nDPkg::Lock::Timeout "60";\n' | sudo tee /etc/apt/apt.conf.d/99-ci-cache > /dev/null
        cd app
        timeout 120s npx playwright install-deps "$BROWSER"
    - name: Browser binary
      if: inputs.browser != '' && steps.browser.outputs.cache-hit != 'true'
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
      run: |
        cd app
        npx playwright install "$BROWSER"
