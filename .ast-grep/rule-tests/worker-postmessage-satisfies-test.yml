id: worker-postmessage-satisfies
valid:
  - 'worker.postMessage({ type: "pause", paused: true } satisfies WorkerInbound);'
  - 'link.getWorker()?.postMessage({ type: "debug" } satisfies WorkerInbound);'
  - "self.postMessage(message, options ?? []);"
  - "worker.postMessage(message);"
invalid:
  - 'worker.postMessage({ type: "pause", paused: true });'
  - "self.postMessage({ result }, [buffer]);"
  - 'link.getWorker()?.postMessage({ type: "debug", channels });'
