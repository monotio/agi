# Plain copy (AGENTS.md, Code conventions): UI text says what a thing is or
# does. Two documents, one per parser: string literals in TypeScript (and the
# <script setup> of a .vue), and template text and attribute values in a .vue.
id: plain-copy-literal
language: ts
severity: error
message: >-
  Say plainly what the thing is or does: state the positive, and turn a dash
  aside into a colon, a semicolon or two sentences
note: |
  Flagged: " — " asides, "no longer", "rather than", "instead of", ", not "
  and "never". Also flag capability pitches such as "no engine needed",
  "without an API key", "with or without AI" and "simply click".
  Name the feature or action directly. Necessary status and consequence
  lines such as "No changes" and "This cannot be undone" pass.
  A literal that is exactly " — " is a separator code joins two parts with.
  BAD:  title: "Ask about this game — answers without changing it"
  GOOD: title: "Ask about this game"
files:
  - app/src/**
  - games/adventure-department/lessons.ts
ignores:
  - app/src/agent/**
rule:
  kind: string_fragment
  regex: "(?i) — |no longer|rather than|instead of|, not |\\bnever\\b|\\bno (?:AI |API )?(?:engine|key|provider|server|account|setup|coding|code) (?:needed|required|necessary)\\b|\\bwithout (?:an? )?(?:AI|API key|AI key|AI connection|AI provider|coding)\\b|\\bwith or without AI\\b|\\b(?:simply|just) (?:click|choose|connect|enter|open|select|type|start)\\b|\\bediting works either way\\b|\\b(?:drawing|imports) stay(?:s)? available without\\b|\\bnothing is written until you approve\\b"
  not:
    regex: "^ — $"
---
id: plain-copy-template
language: html
severity: error
message: >-
  Say plainly what the thing is or does: state the positive, and turn a dash
  aside into a colon, a semicolon or two sentences
note: |
  The template twin of plain-copy-literal: text and attribute values in a
  .vue template, including the string literals of bound expressions.
  BAD:  <p>Staged — inspect</p>
  GOOD: <p>Proposed</p>
files:
  - app/src/**/*.vue
ignores:
  - app/src/agent/**
rule:
  any:
    - kind: text
    - kind: attribute_value
  regex: "(?i) — |no longer|rather than|instead of|, not |\\bnever\\b|\\bno (?:AI |API )?(?:engine|key|provider|server|account|setup|coding|code) (?:needed|required|necessary)\\b|\\bwithout (?:an? )?(?:AI|API key|AI key|AI connection|AI provider|coding)\\b|\\bwith or without AI\\b|\\b(?:simply|just) (?:click|choose|connect|enter|open|select|type|start)\\b|\\bediting works either way\\b|\\b(?:drawing|imports) stay(?:s)? available without\\b|\\bnothing is written until you approve\\b"
