id: no-constructor-parameter-properties
language: ts
severity: error
message: Constructor parameter properties are TypeScript-only runtime syntax; Node strip-types mode rejects them. Declare the field and assign it in the constructor body.
note: AGENTS.md, Code conventions — nothing that tests and scripts import may use enums, namespaces or constructor parameter properties.
files:
  - src/**/*.ts
  - test/**/*.ts
  - app/src/**/*.ts
  - app/test/**/*.ts
  - scripts/**/*.ts
  - evals/**/*.ts
rule:
  any:
    - kind: required_parameter
    - kind: optional_parameter
  inside:
    kind: formal_parameters
    inside:
      kind: method_definition
      has:
        field: name
        regex: ^constructor$
  # A parameter property carries an accessibility modifier, `readonly`, or both.
  has:
    any:
      - kind: accessibility_modifier
      - regex: ^readonly$
